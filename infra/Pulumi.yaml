name: zakki-infra
runtime: nodejs
# description は stack タグにも入り、上限 256 バイト（日本語は 1 文字 3 バイト）
# を超えると `pulumi stack init` が弾かれるため短く保つ。詳細は README を参照。
description: >-
  zakki の静的インフラ（Turso group/DB + Cloudflare Worker）。
  ユーザごとの DB は実行時生成のため管理外（RESEARCH.md §7）。

# Turso プロバイダは Terraform ブリッジのローカルパッケージとして導入する。
# 下の packages 定義から `pulumi install` が SDK を sdks/turso に再生成する
# （生成物は .gitignore 済み。生成パッケージ名は @pulumi/turso — 検証済み）。
packages:
  turso:
    source: pulumi/pulumi/terraform-provider
    version: 1.1.4
    parameters:
      - celest-dev/turso
