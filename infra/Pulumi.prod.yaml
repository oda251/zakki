config:
  # Turso 組織名。Worker の TURSO_ORG binding になる。
  zakki-infra:tursoOrganization: oda251
  # コントロールプレーン DB の所在。`just provision` の出力をそのまま入れる。
  #   zakki-infra:controlDbUrl: libsql://zakki-control-prod-oda251.aws-ap-northeast-1.turso.io
  # Worker の secrets（sessionSecret / workerTursoApiToken / controlDbToken）は
  # コミットせず CLI で設定する。手順は README を参照。

  # 以下は Turso プロバイダ時代の残骸（issue #132 でこの stack の管理対象外になった）。
  # 組織スコープのトークンで、`just provision` に渡す値としてはまだ使える。
  # 不要になったら削除する: pulumi config rm turso:apiToken
  turso:apiToken:
    secure: 
