<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="edge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3987e5" />
      <stop offset="50%" stop-color="#9085e9" />
      <stop offset="100%" stop-color="#3987e5" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3987e5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9085e9" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="#0d0d0d" stroke="#2c2c2a" stroke-width="4" />

  <!-- Ambient Glow Behind Graph -->
  <circle cx="256" cy="256" r="140" fill="url(#glow-grad)" filter="url(#glow)" />

  <!-- Graph Edges forming "Z" -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Glow layer -->
    <path d="M 160 160 L 352 160 L 160 352 L 352 352"
          fill="none" stroke="#3987e5" stroke-width="26" stroke-opacity="0.3" />
    <!-- Main edge path -->
    <path d="M 160 160 L 352 160 L 160 352 L 352 352"
          fill="none" stroke="url(#edge-grad)" stroke-width="16" />
    
    <!-- Secondary connected edge (thought link) -->
    <path d="M 352 160 L 290 230"
          fill="none" stroke="#9085e9" stroke-width="8" stroke-dasharray="6 6" stroke-opacity="0.7" />
  </g>

  <!-- Minor thought node -->
  <circle cx="290" cy="230" r="10" fill="#9085e9" />
  <circle cx="290" cy="230" r="4" fill="#ffffff" />

  <!-- Main Nodes: 4 corners of Z -->
  <!-- Top-Left -->
  <circle cx="160" cy="160" r="28" fill="#1a1a19" stroke="#3987e5" stroke-width="6" />
  <circle cx="160" cy="160" r="12" fill="#3987e5" />
  <circle cx="160" cy="160" r="5" fill="#ffffff" />

  <!-- Top-Right -->
  <circle cx="352" cy="160" r="28" fill="#1a1a19" stroke="#9085e9" stroke-width="6" />
  <circle cx="352" cy="160" r="12" fill="#9085e9" />
  <circle cx="352" cy="160" r="5" fill="#ffffff" />

  <!-- Bottom-Left -->
  <circle cx="160" cy="352" r="28" fill="#1a1a19" stroke="#199e70" stroke-width="6" />
  <circle cx="160" cy="352" r="12" fill="#199e70" />
  <circle cx="160" cy="352" r="5" fill="#ffffff" />

  <!-- Bottom-Right -->
  <circle cx="352" cy="352" r="28" fill="#1a1a19" stroke="#3987e5" stroke-width="6" />
  <circle cx="352" cy="352" r="12" fill="#3987e5" />
  <circle cx="352" cy="352" r="5" fill="#ffffff" />
</svg>